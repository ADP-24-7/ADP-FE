name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: local
      VITE_API_MODE: mock
      VITE_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
